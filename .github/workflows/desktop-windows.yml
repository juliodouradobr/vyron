# Gera o instalador do VYRON para Windows (.exe e .msi) num computador Windows do GitHub.
# Você não precisa instalar Rust no seu PC: rode este fluxo em "Actions" → "Instalador Windows" →
# "Run workflow", e baixe o instalador em "Artifacts" no fim da execução.
#
# Opcional: defina a variável do repositório VYRON_SERVER_URL (Settings → Secrets and variables →
# Actions → Variables) com o endereço do seu servidor, ex.: https://vyron.seudominio.com.br.
# Assim o app já abre apontando para ele (ainda dá para trocar na tela de entrada).
name: Instalador Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci
      - name: Compilar o app e gerar instaladores
        working-directory: apps/desktop
        env:
          VITE_API_URL: ${{ vars.VYRON_SERVER_URL }}
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-Windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
