[package]
name = "vyron"
version = "0.1.0"
description = "VYRON — comunicação para gamers"
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"

[lib]
name = "nexo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# Gerenciador de Credenciais do Windows (DPAPI). MIT/Apache-2.0.
keyring = { version = "3", features = ["windows-native"] }
# Atalho de emergência global do Jogar Juntos (Ctrl+Shift+F12). MIT/Apache-2.0.
tauri-plugin-global-shortcut = "2"
# Avisos nativos do Windows. MIT/Apache-2.0.
tauri-plugin-notification = "2"

# Injeção de entrada do Jogar Juntos (SendInput) e lista de janelas. MIT/Apache-2.0 (Microsoft).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
